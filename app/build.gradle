plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "org.rmj.guanzongroup.ghostrider.epacss"
        minSdk 24
        targetSdk 35
        versionCode 100
        versionName "Guanzon Circle v4.28.071.096 s"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    namespace 'org.rmj.guanzongroup.ghostrider.epacss'

    packaging {
        resources {
            merges.add("core.properties")
        }
        jniLibs {
            // Setting this to false allows the OS to mmap the library directly from the APK.
            // This requires the library to be page-aligned (16KB for Android 15).
            useLegacyPackaging = false

            // Permanently remove x86 and x86_64 libraries to resolve conflicts
            // and ensure 16KB page size compatibility.
            excludes.add("lib/arm64-v8a/**")
            excludes.add("lib/x86_64/**")
            excludes.add("lib/x86/**")
            excludes.add("lib/armeabi-v7a/**")
        }
        dex {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.5'
    implementation 'androidx.navigation:navigation-ui:2.9.5'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation("com.google.firebase:firebase-inappmessaging-display-ktx:21.0.2")
    implementation 'com.google.firebase:firebase-crashlytics:20.0.2'
    implementation 'com.google.firebase:firebase-analytics:23.0.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation("io.grpc:grpc-okhttp:1.73.0")
    implementation 'androidx.work:work-runtime:2.10.2'
    implementation 'commons-io:commons-io:2.19.0'
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'
    implementation project(path: ':authLibrary')
    implementation project(path: ':documentScanner')
    implementation project(path: ':ahMonitoring')
    implementation project(path: ':promotions')
    implementation project(path: ':samsungKnox')
    implementation project(path: ':approvalCode')
    implementation project(path: ':panalo')
    implementation project(path: ':notifications')
    implementation project(path: ':dailyCollectionPlan')
    implementation project(path: ':dataChecker')
    implementation project(path: ':itinerary')
    implementation project(path: ':appDriver')
    implementation project(path: ':petManager')
    implementation project(':settings')
    implementation project(':creditApp')
    implementation project(':creditEvaluation')
    implementation project(':evaluation')
    implementation project(':ganado')
    implementation project(':sales')
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
