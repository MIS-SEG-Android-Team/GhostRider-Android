plugins{
    id 'com.android.library'
}

android {
    compileSdk 35

    defaultConfig {
        multiDexEnabled true
        minSdk 24
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }
    }
    sourceSets {
        debug.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'org.rmj.g3appdriver'

    packaging {
        resources {
            merges.add("core.properties")
        }
        jniLibs {
            // Setting this to false allows the OS to mmap the library directly from the APK.
            // This requires the library to be page-aligned (16KB for Android 15).
            useLegacyPackaging = false

            // Permanently remove x86 and x86_64 libraries to resolve conflicts
            // and ensure 16KB page size compatibility.
            excludes.add("lib/arm64-v8a/**")
            excludes.add("lib/x86_64/**")
            excludes.add("lib/x86/**")
            excludes.add("lib/armeabi-v7a/**")
        }
        dex {
            useLegacyPackaging = false
        }
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.sqlite:sqlite:2.4.0'
