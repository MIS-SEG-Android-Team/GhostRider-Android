plugins{
    id 'com.android.library'
}

android {
    compileSdk 36

    defaultConfig {
        multiDexEnabled true
        minSdk 24
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }
    }
    sourceSets {
        debug.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'org.rmj.g3appdriver'

    packagingOptions {
        resources.merges.add("core.properties")
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.sqlite:sqlite:2.6.2'
    implementation 'androidx.test:core:1.7.0'
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.firebase:firebase-messaging:25.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.0.0'
    implementation 'com.google.firebase:firebase-storage:22.0.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.room:room-testing-android:2.8.4'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"

    implementation 'com.mcxiaoke.volley:library-aar:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0@aar'

    /*GOOGLE PLAY*/

    //JAVA
    implementation("com.google.android.play:asset-delivery:2.3.0")
    implementation("com.google.android.play:feature-delivery:2.1.0")
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:app-update:2.1.0")

    //GOOGLE FACE DETECT LIBRARIES
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'

    // MediaPipe solution-core is the foundation of any MediaPipe Solutions.
    //implementation 'com.google.mediapipe:solution-core:latest.release'
    // Optional: MediaPipe Face Detection Solution.
    //implementation 'com.google.mediapipe:facedetection:latest.release'
    // Optional: MediaPipe Face Mesh Solution.
    //implementation 'com.google.mediapipe:facemesh:latest.release'
    //Media Task Vision Solution
    implementation 'com.google.mediapipe:tasks-vision:latest.release'

    // CameraX core library
    def camerax_version = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax_version"

    // CameraX Camera2 extensions
    implementation "androidx.camera:camera-camera2:$camerax_version"

    // CameraX Lifecycle library
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // CameraX View class
    implementation "androidx.camera:camera-view:$camerax_version"

    // Kotlin
    ///implementation 'androidx.core:core-ktx:1.9.0'
    implementation("com.google.android.play:asset-delivery-ktx:2.3.0")
    implementation("com.google.android.play:feature-delivery-ktx:2.1.0")
    implementation("com.google.android.play:review-ktx:2.0.2")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    androidTestImplementation 'org.testng:testng:7.11.0'
    annotationProcessor('androidx.room:room-compiler:2.8.4')

    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.huawei.hms:maps:4.0.1.302'
    implementation 'com.huawei.hms:location:6.4.0.300'
    implementation 'com.huawei.hms:site:4.0.3.300'
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'

    //Image loader
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Image Slider Dependencies
    implementation 'com.github.smarteist:Android-Image-Slider:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    //Local Libraries
    implementation files('libs/appdriver.jar')
    implementation files('libs/json-simple-1.1.1.jar')
    implementation files('libs/commons-codec-1.11.jar')
    implementation files('libs/gocas.jar')
    implementation files('libs/commons-lang3-3.3.2.jar')
    implementation files('libs/javax.persistence_2.1.0.v201304241213.jar')
    implementation files('libs/sqldroid-1.1.0-rc1.jar')
}
